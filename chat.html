<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE COUNT - NCSI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ── Canvas background ── */
        #bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ── Floating orbs ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            z-index: 0;
            pointer-events: none;
            animation: drift linear infinite;
        }
        @keyframes drift {
            0%   { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(40px, -60px) scale(1.1); }
            66%  { transform: translate(-30px, 50px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* ── Main card ── */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 48px 64px;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.06) inset,
                0 40px 80px rgba(0,0,0,0.6);
            max-width: 520px;
            width: 90%;
        }

        /* ── Brand label ── */
        .brand {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            margin-bottom: 10px;
        }

        /* ── Live badge ── */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(255, 60, 60, 0.18);
            border: 1px solid rgba(255, 80, 80, 0.35);
            border-radius: 100px;
            padding: 5px 14px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #ff6b6b;
            margin-bottom: 24px;
            text-transform: uppercase;
        }
        .live-dot {
            width: 7px; height: 7px;
            background: #ff4444;
            border-radius: 50%;
            animation: pulse-red 1.2s ease-in-out infinite;
        }
        @keyframes pulse-red {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.4; transform: scale(0.7); }
        }

        /* ── Channel title ── */
        .channel-name {
            font-size: 15px;
            font-weight: 500;
            color: rgba(255,255,255,0.55);
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        /* ── Count display ── */
        .count-wrapper {
            position: relative;
            margin: 8px 0 28px;
        }
        #count {
            font-size: 76px;
            font-weight: 700;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #a78bfa, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            transition: transform 0.15s ease;
            display: block;
        }
        #count.bump {
            transform: scale(1.06);
        }
        .count-label {
            font-size: 12px;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            margin-top: 8px;
        }

        /* ── Delta pill ── */
        #delta {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 18px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 28px;
            transition: all 0.4s ease;
            min-width: 110px;
            justify-content: center;
        }
        #delta.neutral { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.08); }
        #delta.gain    { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52,211,153,0.3); }
        #delta.loss    { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }

        /* ── Stats row ── */
        .stats-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
        }
        .stat {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 20px;
            flex: 1;
        }
        .stat-val { font-size: 20px; font-weight: 600; color: #fff; }
        .stat-lbl { font-size: 10px; letter-spacing: 1.5px; color: rgba(255,255,255,0.3); text-transform: uppercase; margin-top: 3px; }

        /* ── Refresh bar ── */
        .refresh-bar-wrap {
            background: rgba(255,255,255,0.06);
            border-radius: 100px;
            height: 3px;
            overflow: hidden;
            margin-top: 8px;
        }
        #refresh-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            border-radius: 100px;
            transform-origin: left;
            animation: shrink 10s linear infinite;
        }
        @keyframes shrink {
            from { transform: scaleX(1); }
            to   { transform: scaleX(0); }
        }
        .refresh-hint {
            font-size: 10px;
            color: rgba(255,255,255,0.2);
            margin-top: 6px;
            letter-spacing: 1px;
        }

        /* ── Toast notifications ── */
        #toast-container {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }
        .toast {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            max-width: 300px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            animation: slide-in 0.4s cubic-bezier(0.34,1.56,0.64,1);
            cursor: pointer;
        }
        .toast.gain {
            background: rgba(20, 50, 35, 0.92);
            border: 1px solid rgba(52, 211, 153, 0.4);
            color: #6ee7b7;
        }
        .toast.loss {
            background: rgba(50, 20, 20, 0.92);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #fca5a5;
        }
        .toast-icon { font-size: 22px; }
        .toast-text { line-height: 1.4; }
        .toast-title { font-weight: 700; font-size: 13px; letter-spacing: 0.5px; }
        .toast-body  { font-size: 12px; opacity: 0.75; }
        .toast.fade-out {
            animation: slide-out 0.35s ease forwards;
        }
        @keyframes slide-in {
            from { opacity: 0; transform: translateX(60px) scale(0.9); }
            to   { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes slide-out {
            from { opacity: 1; transform: translateX(0) scale(1); }
            to   { opacity: 0; transform: translateX(60px) scale(0.9); }
        }

        /* ── Floating +1 particles ── */
        .float-particle {
            position: fixed;
            font-size: 18px;
            font-weight: 700;
            pointer-events: none;
            z-index: 9998;
            animation: float-up 1.6s ease-out forwards;
        }
        @keyframes float-up {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(0.6); }
        }

        /* ── Ripple burst on change ── */
        #ripple-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<canvas id="ripple-canvas"></canvas>

<!-- Floating orbs -->
<div class="orb" style="width:600px;height:600px;background:#6d28d9;top:-150px;left:-150px;animation-duration:18s;"></div>
<div class="orb" style="width:500px;height:500px;background:#0ea5e9;bottom:-100px;right:-100px;animation-duration:22s;animation-delay:-7s;"></div>
<div class="orb" style="width:400px;height:400px;background:#059669;top:40%;left:60%;animation-duration:25s;animation-delay:-13s;"></div>
<div class="orb" style="width:350px;height:350px;background:#be185d;bottom:20%;left:10%;animation-duration:20s;animation-delay:-5s;"></div>

<div class="card">
    <div class="brand">Nabhans Crafts Ideas</div>

    <div class="live-badge">
        <div class="live-dot"></div>
        Live
    </div>

    <div class="channel-name">Subscriber Counter</div>

    <div class="count-wrapper">
        <span id="count">—</span>
        <div class="count-label">subscribers</div>
    </div>

    <div id="delta" class="neutral">— no change —</div>

    <div class="stats-row">
        <div class="stat">
            <div class="stat-val" id="stat-peak">—</div>
            <div class="stat-lbl">Session peak</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="stat-gained">+0</div>
            <div class="stat-lbl">Gained today</div>
        </div>
        <div class="stat">
            <div class="stat-val" id="stat-lost">−0</div>
            <div class="stat-lbl">Lost today</div>
        </div>
    </div>

    <div class="refresh-bar-wrap">
        <div id="refresh-bar"></div>
    </div>
    <div class="refresh-hint">Refreshes every 1 seconds</div>
</div>

<div id="toast-container"></div>

<script>
/* ───────────────────────────────
   CONFIG — fill these in
─────────────────────────────── */
const API_KEY    = 'AIzaSyCx967o-Rb3BPOLgkhIXOHVZeni0ak742o';
const CHANNEL_ID = 'UCV6XeVyyYqKettwhHXb7cbg';
const INTERVAL   =  1000; // ms

/* ───────────────────────────────
   Particle canvas — starfield
─────────────────────────────── */
const bgCanvas = document.getElementById('bgCanvas');
const ctx = bgCanvas.getContext('2d');
let stars = [], W, H;

function resizeCanvas() {
    W = bgCanvas.width  = window.innerWidth;
    H = bgCanvas.height = window.innerHeight;
    initStars();
}

function initStars() {
    stars = Array.from({ length: 200 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.3,
        speed: Math.random() * 0.25 + 0.05,
        opacity: Math.random() * 0.7 + 0.15,
        twinkle: Math.random() * Math.PI * 2,
        color: ['#a78bfa','#60a5fa','#34d399','#fff','#f0abfc'][Math.floor(Math.random()*5)]
    }));
}

function drawStars(ts) {
    ctx.clearRect(0, 0, W, H);
    stars.forEach(s => {
        s.twinkle += 0.02;
        const alpha = s.opacity * (0.7 + 0.3 * Math.sin(s.twinkle));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = s.color;
        ctx.globalAlpha = alpha;
        ctx.fill();
        s.y -= s.speed;
        if (s.y < -5) { s.y = H + 5; s.x = Math.random() * W; }
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(drawStars);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
requestAnimationFrame(drawStars);

/* ───────────────────────────────
   Ripple canvas
─────────────────────────────── */
const ripCanvas = document.getElementById('ripple-canvas');
const rctx = ripCanvas.getContext('2d');
let ripples = [];

function resizeRip() {
    ripCanvas.width  = window.innerWidth;
    ripCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeRip);
resizeRip();

function spawnRipple(color) {
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    ripples.push({ x: cx, y: cy, r: 0, maxR: Math.max(cx, cy) * 1.2, alpha: 0.35, color });
}

function drawRipples() {
    rctx.clearRect(0, 0, ripCanvas.width, ripCanvas.height);
    ripples = ripples.filter(r => r.alpha > 0.01);
    ripples.forEach(r => {
        r.r     += 6;
        r.alpha *= 0.93;
        rctx.beginPath();
        rctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        rctx.strokeStyle = r.color;
        rctx.lineWidth   = 2;
        rctx.globalAlpha = r.alpha;
        rctx.stroke();
        rctx.globalAlpha = 1;
    });
    requestAnimationFrame(drawRipples);
}
drawRipples();

/* ───────────────────────────────
   Floating +/- number particles
─────────────────────────────── */
function spawnParticle(diff) {
    const p = document.createElement('div');
    p.className = 'float-particle';
    p.textContent = diff > 0 ? `+${diff}` : `${diff}`;
    p.style.color  = diff > 0 ? '#34d399' : '#f87171';
    p.style.left   = (30 + Math.random() * 40) + 'vw';
    p.style.bottom = (20 + Math.random() * 20) + 'vh';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1700);
}

/* ───────────────────────────────
   Toast / push notification
─────────────────────────────── */
function showToast(type, diff) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;

    const icon = type === 'gain' ? '🎉' : '📉';
    const title = type === 'gain' ? 'New Subscriber!' : 'Lost a Subscriber';
    const body  = type === 'gain'
        ? `You gained ${Math.abs(diff)} subscriber${Math.abs(diff)>1?'s':''}!`
        : `You lost ${Math.abs(diff)} subscriber${Math.abs(diff)>1?'s':''}.`;

    toast.innerHTML = `
        <div class="toast-icon">${icon}</div>
        <div class="toast-text">
            <div class="toast-title">${title}</div>
            <div class="toast-body">${body}</div>
        </div>`;

    toast.onclick = () => dismiss(toast);
    container.appendChild(toast);

    const timer = setTimeout(() => dismiss(toast), 5000);

    function dismiss(t) {
        clearTimeout(timer);
        t.classList.add('fade-out');
        setTimeout(() => t.remove(), 380);
    }

    /* Browser push notification (requires permission) */
    if (Notification.permission === 'granted') {
        new Notification(title, {
            body,
            icon: 'https://www.youtube.com/favicon.ico'
        });
    }
}

/* Ask push permission on load */
if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
}

/* ───────────────────────────────
   State
─────────────────────────────── */
let prevCount  = null;
let sessionGained = 0;
let sessionLost   = 0;
let peakCount  = null;

function fmt(n) {
    return Number(n).toLocaleString();
}

function updateUI(count) {
    const countEl = document.getElementById('count');
    const deltaEl = document.getElementById('delta');

    /* Animate count bump */
    countEl.textContent = fmt(count);
    countEl.classList.add('bump');
    setTimeout(() => countEl.classList.remove('bump'), 200);

    /* Peak */
    if (peakCount === null || count > peakCount) peakCount = count;
    document.getElementById('stat-peak').textContent = fmt(peakCount);

    if (prevCount !== null && count !== prevCount) {
        const diff = count - prevCount;
        const type = diff > 0 ? 'gain' : 'loss';

        /* Delta pill */
        deltaEl.className  = `${type}`;
        deltaEl.textContent = diff > 0 ? `+${fmt(diff)} subscriber${Math.abs(diff)>1?'s':''}` : `${fmt(diff)} subscriber${Math.abs(diff)>1?'s':''}`;

        /* Session stats */
        if (diff > 0) { sessionGained += diff; }
        else          { sessionLost   += Math.abs(diff); }
        document.getElementById('stat-gained').textContent = `+${fmt(sessionGained)}`;
        document.getElementById('stat-lost').textContent   = `−${fmt(sessionLost)}`;

        /* Effects */
        showToast(type, diff);
        spawnRipple(diff > 0 ? 'rgba(52,211,153,0.6)' : 'rgba(248,113,113,0.6)');
        for (let i = 0; i < Math.min(Math.abs(diff), 6); i++) {
            setTimeout(() => spawnParticle(diff), i * 180);
        }
    } else if (prevCount === null) {
        /* First load */
        deltaEl.className   = 'neutral';
        deltaEl.textContent = '— just loaded —';
        document.getElementById('stat-gained').textContent = '+0';
        document.getElementById('stat-lost').textContent   = '−0';
    }

    prevCount = count;
}

/* ───────────────────────────────
   YouTube API fetch
─────────────────────────────── */
function fetchCount() {
    fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${CHANNEL_ID}&key=${API_KEY}`)
        .then(r => r.json())
        .then(data => {
            const count = parseInt(data.items[0].statistics.subscriberCount, 10);
            updateUI(count);
        })
        .catch(() => {
            document.getElementById('count').textContent = 'Error';
        });
}

/* Restart the bar animation on each tick */
function restartBar() {
    const bar = document.getElementById('refresh-bar');
    bar.style.animation = 'none';
    bar.offsetHeight; /* reflow */
    bar.style.animation = `shrink ${INTERVAL/1000}s linear infinite`;
}

fetchCount();
setInterval(() => { fetchCount(); restartBar(); }, INTERVAL);
</script>
</body>
</html>
