<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE COUNT - Nabhans Crafts Ideas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0a0a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .main-wrapper {
            display: grid;
            grid-template-columns: 340px 480px 340px;
            align-items: stretch;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1500px;
            z-index: 10;
        }

        @media (max-width: 1200px) {
            .main-wrapper { grid-template-columns: 1fr 1.2fr; }
            .wall-frame { grid-column: span 2; }
        }

        #bgCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        
        .glass-panel {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        /* LEFT: STEPS */
        .steps-title { font-size: 13px; font-weight: 700; color: #fbbf24; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 25px; text-align: center; }
        .step-item {
            display: flex; align-items: center; gap: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 15px; padding: 14px; margin-bottom: 12px;
        }
        .step-num { width: 30px; height: 30px; background: linear-gradient(135deg, #a78bfa, #60a5fa); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0; }
        .step-text { font-size: 13px; color: rgba(255,255,255,0.8); line-height: 1.4; }

        /* CENTER: CARD */
        .card { text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .live-badge { display: inline-flex; align-items: center; gap: 7px; background: rgba(255,60,60,0.18); border: 1px solid rgba(255,80,80,0.35); border-radius: 100px; padding: 5px 14px; font-size: 12px; color: #ff6b6b; margin-bottom: 20px; text-transform: uppercase; align-self: center; }
        .live-dot { width: 7px; height: 7px; background: #ff4444; border-radius: 50%; animation: pulse 1.2s infinite; }
        @keyframes pulse { 50% { opacity: 0.4; transform: scale(0.8); } }
        
        #count { font-size: 84px; font-weight: 800; background: linear-gradient(135deg, #a78bfa, #60a5fa, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin: 5px 0; }
        .count-label { font-size: 12px; letter-spacing: 4px; color: rgba(255,255,255,0.3); text-transform: uppercase; margin-bottom: 25px; }

        .stats-row { display: flex; gap: 10px; margin-bottom: 25px; }
        .stat-box { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 15px; padding: 12px; }
        .stat-val { font-size: 18px; font-weight: 700; color: #fff; }
        .stat-lbl { font-size: 10px; color: rgba(255,255,255,0.3); text-transform: uppercase; margin-top: 4px; }

        /* RIGHT: WALL */
        .wall-frame { display: flex; flex-direction: column; max-height: 600px; }
        .sub-list { flex: 1; overflow-y: auto; padding-right: 8px; }
        .sub-list::-webkit-scrollbar { width: 4px; }
        .sub-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        .sub-item { 
            display: flex; align-items: center; gap: 12px; 
            background: rgba(255,255,255,0.03); border-radius: 15px; 
            padding: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.06); 
        }
        .sub-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #3b82f6); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0; }
        .sub-info { flex: 1; min-width: 0; }
        .sub-name { font-size: 14px; color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .sub-actions { display: flex; gap: 5px; }
        .action-btn { background: rgba(255,255,255,0.06); border: none; color: #fff; width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-edit:hover { background: rgba(96,165,250,0.2); color: #60a5fa; }
        .btn-del:hover { background: rgba(248,113,113,0.2); color: #f87171; }

        /* BUTTONS */
        .btn-main { padding: 14px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; background: linear-gradient(135deg, #7c3aed, #3b82f6); color: #fff; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(124, 58, 237, 0.3); }

        /* MODAL */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-overlay.open { display: flex; }
        .modal { background: #111128; border: 1px solid rgba(255,255,255,0.1); padding: 35px; border-radius: 24px; width: 90%; max-width: 420px; }
        .form-input { width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; margin-bottom: 12px; outline: none; }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="main-wrapper">
    <div class="glass-panel">
        <div class="steps-title">✨ Steps to Join</div>
        <div class="step-item"><div class="step-num">1</div><div class="step-text">Like the Live Stream 👍</div></div>
        <div class="step-item"><div class="step-num">2</div><div class="step-text">Subscribe to Channel 🔴</div></div>
        <div class="step-item"><div class="step-num">3</div><div class="step-text">Turn on Notifications 🔔</div></div>
        <div class="step-item"><div class="step-num">4</div><div class="step-text">Type your name in Chat ✍️</div></div>
    </div>

    <div class="glass-panel card">
        <div class="live-badge"><div class="live-dot"></div> Live</div>
        <div style="font-size: 11px; color: rgba(255,255,255,0.3); letter-spacing: 3px; margin-bottom: 5px;">NABHANS CRAFTS IDEAS</div>
        <div id="count">0</div>
        <div class="count-label">Subscribers</div>

        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-val" id="gained">+0</div>
                <div class="stat-lbl">Gained today</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="lost">−0</div>
                <div class="stat-lbl">Lost today</div>
            </div>
        </div>

        <button class="btn-main" onclick="openAddModal()">✍️ Add My Name</button>
    </div>

    <div class="glass-panel wall-frame">
        <div style="text-align:center; color:#fff; font-weight:700; margin-bottom:20px;">👥 Wall of Fame</div>
        <div class="sub-list" id="subList"></div>
    </div>
</div>

<div class="modal-overlay" id="addModal">
    <div class="modal">
        <h2 style="color:#fff; margin-bottom:20px; text-align:center;">Add Your Name</h2>
        <input class="form-input" id="nameInput" placeholder="Enter Name" maxlength="25">
        <button class="btn-main" style="width:100%" onclick="submitName()">🎉 Join List</button>
        <button style="width:100%; background:none; border:none; color:rgba(255,255,255,0.4); margin-top:15px; cursor:pointer;" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
    const API_KEY = 'AIzaSyCx967o-Rb3BPOLgkhIXOHVZeni0ak742o';
    const CHANNEL_ID = 'UCV6XeVyyYqKettwhHXb7cbg';
    
    // UI State
    let prevCount = null;
    let gainedToday = 0;
    let lostToday = 0;
    let subs = JSON.parse(localStorage.getItem('live_subs_v2') || '[]');

    async function fetchYT() {
        try {
            const res = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${CHANNEL_ID}&key=${API_KEY}`);
            const data = await res.json();
            const count = parseInt(data.items[0].statistics.subscriberCount);
            
            if(prevCount !== null && count !== prevCount) {
                const diff = count - prevCount;
                if(diff > 0) gainedToday += diff;
                else lostToday += Math.abs(diff);
                updateStats();
            }
            
            document.getElementById('count').innerText = count.toLocaleString();
            prevCount = count;
        } catch(e) {}
    }

    function updateStats() {
        document.getElementById('gained').innerText = `+${gainedToday}`;
        document.getElementById('lost').innerText = `−${lostToday}`;
    }

    function renderList() {
        const list = document.getElementById('subList');
        list.innerHTML = subs.map((s, i) => `
            <div class="sub-item">
                <div class="sub-avatar">${s.name[0].toUpperCase()}</div>
                <div class="sub-info">
                    <div class="sub-name">${s.name}</div>
                    <div style="font-size:10px; color:rgba(255,255,255,0.3)">Joined ${s.time}</div>
                </div>
                <div class="sub-actions">
                    <button class="action-btn btn-edit" onclick="editName(${i})">✏️</button>
                    <button class="action-btn btn-del" onclick="deleteName(${i})">🗑️</button>
                </div>
            </div>
        `).join('');
    }

    function openAddModal() { document.getElementById('addModal').classList.add('open'); }
    function closeModal() { document.getElementById('addModal').classList.remove('open'); }

    function submitName() {
        const name = document.getElementById('nameInput').value.trim();
        if(!name) return;
        subs.unshift({ name, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
        saveAndRender();
        closeModal();
        document.getElementById('nameInput').value = "";
    }

    function deleteName(index) {
        if(confirm("Remove this name?")) {
            subs.splice(index, 1);
            saveAndRender();
        }
    }

    function editName(index) {
        const newName = prompt("Edit name:", subs[index].name);
        if(newName) {
            subs[index].name = newName;
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('live_subs_v2', JSON.stringify(subs));
        renderList();
    }

    // BG Animation
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();
    function animate() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "rgba(255,255,255,0.1)";
        for(let i=0; i<50; i++) ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);
        requestAnimationFrame(animate);
    }
    animate();

    setInterval(fetchYT, 3000);
    fetchYT();
    renderList();
</script>

</body>
</html>
