
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Nabhan Crafts Ideas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
/* General Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #fdf6f0;
    color: #333;
}

/* ── DESKTOP HEADER ── */
header {
    background: white;
    padding: 1rem 5%;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    position: sticky;
    top: 0;
    z-index: 1000;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* Logo */
.channel-logo .logo {
    height: 60px;
    width: 60px;
    border-radius: 50%;
    border: 3px solid #ff7e67;
    transition: transform 0.3s ease;
}

.channel-logo .logo:hover {
    transform: scale(1.1) rotate(5deg);
}

/* Navigation List */
nav ul {
    display: flex;
    list-style: none;
    gap: 15px;
    align-items: center;
}

/* Button Styling */
.button {
    text-decoration: none;
    color: #555;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 30px;
    transition: all 0.3s ease;
    font-size: 0.95rem;
}

.button:hover {
    background-color: #ffe8e4;
    color: #ff7e67;
}

/* Special Chat Button */
.button.special {
    background: linear-gradient(135deg, #ff7e67, #ff5e62);
    color: white;
    box-shadow: 0 4px 10px rgba(255, 126, 103, 0.3);
}

.button.special:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(255, 126, 103, 0.4);
    background: linear-gradient(135deg, #ff5e62, #ff7e67);
}

/* ── MOBILE BOTTOM BAR ── */
@media (max-width: 768px) {

    /* Hide the sticky top header on mobile */
    header {
        display: none;
    }

    /* Fixed bottom bar */
    .mobile-bottom-bar {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        background: white;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
        border-top: 1px solid #f0e8e4;
        padding: 6px 0 max(6px, env(safe-area-inset-bottom));
    }

    .mobile-bottom-bar ul {
        display: flex;
        width: 100%;
        list-style: none;
        justify-content: space-around;
        align-items: center;
        gap: 0;
    }

    .mobile-bottom-bar ul li {
        flex: 1;
        display: flex;
        justify-content: center;
    }

    .mobile-bottom-bar .button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 6px 4px;
        border-radius: 12px;
        font-size: 0.7rem;
        font-weight: 600;
        color: #888;
        transition: all 0.2s ease;
        width: 100%;
        text-align: center;
    }

    .mobile-bottom-bar .button:hover,
    .mobile-bottom-bar .button:active {
        background-color: #ffe8e4;
        color: #ff7e67;
    }

    .mobile-bottom-bar .button .icon {
        font-size: 1.3rem;
        line-height: 1;
    }

    /* Special Chat button in bottom bar */
    .mobile-bottom-bar .button.special {
        background: linear-gradient(135deg, #ff7e67, #ff5e62);
        color: white;
        box-shadow: 0 2px 8px rgba(255, 126, 103, 0.35);
        border-radius: 14px;
        padding: 8px 6px;
    }

    .mobile-bottom-bar .button.special:hover,
    .mobile-bottom-bar .button.special:active {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 126, 103, 0.45);
        background: linear-gradient(135deg, #ff5e62, #ff7e67);
        color: white;
    }

    /* Add bottom padding to body so content isn't hidden behind bar */
    body {
        padding-bottom: 80px;
    }
}

/* Hide bottom bar on desktop */
@media (min-width: 769px) {
    .mobile-bottom-bar {
        display: none;
    }
}
    </style>
</head>
<body>

    <!-- ── DESKTOP HEADER ── -->
    <header>
        <nav>
            <div class="channel-logo">
                <img src="images/channels4_profile.jpg" alt="Logo" class="logo">
            </div>
            <ul>
                <li><a href="home.html" class="button">Home</a></li>
                <li><a href="about.html" class="button">About</a></li>
                <li><a href="contact.html" class="button">Contact</a></li>
                <li><a href="subscribe.html" class="button">Sub</a></li>
                <li><a href="polling.html" class="button">Poll</a></li>
                <li><a href="notices.html" class="button">News</a></li>
                <li><a href="chat.html" class="button special">Chat</a></li>
            </ul>
        </nav>
    </header>

    <!-- ── MOBILE BOTTOM BAR ── -->
    <nav class="mobile-bottom-bar">
        <ul>
            <li>
                <a href="home.html" class="button">
                    <span class="icon"><i class="fa-solid fa-house"></i></span>
                    Home
                </a>
            </li>
            <li>
                <a href="about.html" class="button">
                    <span class="icon"><i class="fa-solid fa-circle-info"></i></span>
                    About
                </a>
            </li>
            <li>
                <a href="contact.html" class="button">
                    <span class="icon"><i class="fa-solid fa-envelope"></i></span>
                    Contact
                </a>
            </li>
            <li>
                <a href="subscribe.html" class="button">
                    <span class="icon"><i class="fa-solid fa-star"></i></span>
                    Sub
                </a>
            </li>
            <li>
                <a href="polling.html" class="button">
                    <span class="icon"><i class="fa-solid fa-chart-bar"></i></span>
                    Poll
                </a>
            </li>
            <li>
                <a href="notices.html" class="button">
                    <span class="icon"><i class="fa-solid fa-newspaper"></i></span>
                    News
                </a>
            </li>
            <li>
                <a href="chat.html" class="button special">
                    <span class="icon"><i class="fa-solid fa-comments"></i></span>
                    Chat
                </a>
            </li>
        </ul>
    </nav>

</body>
</html>
