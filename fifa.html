
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Football Scores</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        .match-card { 
            background: white; padding: 15px; margin-bottom: 10px; 
            border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .team-name { font-weight: bold; }
        .score { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Upcoming / Live Matches</h1>
    <div id="match-container">Loading matches...</div>

    <script>
        const API_TOKEN = '760cf7fcdee74edd8e05a33f5f65eae6';
        const container = document.getElementById('match-container');

        async function fetchMatches() {
            try {
                const response = await fetch('https://api.football-data.org/v4/matches', {
                    headers: { 'X-Auth-Token': API_TOKEN }
                });
                const data = await response.json();

                if (!data.matches) {
                    container.innerHTML = "No matches found.";
                    return;
                }

                container.innerHTML = ""; // Clear loader
                
                data.matches.forEach(match => {
                    const div = document.createElement('div');
                    div.className = 'match-card';
                    div.innerHTML = `
                        <span class="team-name">${match.homeTeam.name}</span> 
                        <span class="score">${match.score.fullTime.home ?? 0} - ${match.score.fullTime.away ?? 0}</span> 
                        <span class="team-name">${match.awayTeam.name}</span>
                        <br><small>${new Date(match.utcDate).toLocaleString()}</small>
                    `;
                    container.appendChild(div);
                });
            } catch (error) {
                container.innerHTML = "Error loading data. Check console.";
                console.error(error);
            }
        }

        fetchMatches();
    </script>
</body>
</html>
